name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        run: npm run lint
      - name: Run tests
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Build server
        run: go build ./...
      - name: Validate admission benchmark receipt
        run: make admission-receipt-check

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/typescript-generator/package-lock.json
      - name: Verify Go module caches
        run: go mod verify && (cd api && go mod verify)
      - name: Install API TypeScript generator dependencies
        run: npm ci --prefix api/typescript-generator --ignore-scripts --no-audit --no-fund
      - name: Audit API TypeScript generator dependencies
        run: npm audit --prefix api/typescript-generator --audit-level=high
      - name: Check API contract and generated types
        run: make api-check

  compatibility:
    name: Ansible Vault compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Ansible Vault CLI
        run: python -m pip install --disable-pip-version-check --no-input 'ansible-core==2.21.2'
      - name: Run compatibility tests
        run: make compatibility

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.3
      - name: Lint chart
        run: make helm-lint
      - name: Run chart tests
        run: make chart-test

  helm-kind:
    name: Helm kind integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.3
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: vaultsmith
          wait: 120s
      - name: Build test image
        run: docker build --tag vaultsmith:ci .
      - name: Load test image
        run: kind load docker-image vaultsmith:ci --name vaultsmith
      - name: Install chart and run Helm test
        env:
          RELEASE_NAME: vaultsmith
          NAMESPACE: vaultsmith
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          kubectl create secret generic vaultsmith-passwords \
            --namespace "$NAMESPACE" \
            --from-literal='dev=fixture-password' \
            --from-literal='prod=fixture-destination-password'
          helm upgrade --install "$RELEASE_NAME" deploy/helm/vaultsmith \
            --namespace "$NAMESPACE" \
            --values deploy/helm/vaultsmith/tests/values-kind.yaml \
            --wait \
            --timeout 180s
          kubectl wait \
            --namespace "$NAMESPACE" \
            --for=condition=available \
            deployment/"$RELEASE_NAME" \
            --timeout=120s
          printf '%s' '{"version":1,"active":"synthetic-key","keys":[{"id":"synthetic-key","state":"active","publicKey":"iojj3XQJ8ZX9UtstPLpdcspnCb8dlBIb83SIAbQPb1w","privateKey":"AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE"}]}' > "$RUNNER_TEMP/vaultsmith-keyring.json"
          kubectl create secret generic vaultsmith-attestation \
            --namespace "$NAMESPACE" \
            --from-file=keyring.json="$RUNNER_TEMP/vaultsmith-keyring.json"
          helm upgrade "$RELEASE_NAME" deploy/helm/vaultsmith \
            --namespace "$NAMESPACE" \
            --reuse-values \
            --set auth.oidc.publicBaseURL=https://vaultsmith.example.test \
            --set proofs.enabled=true \
            --set proofs.existingSecret=vaultsmith-attestation \
            --wait \
            --timeout 180s
          proof_deployment="$(kubectl get deployment "$RELEASE_NAME" --namespace "$NAMESPACE" -o json)"
          jq -e '
            any(.spec.template.spec.containers[0].env[]; .name == "PROOFS_ENABLED" and .value == "true") and
            any(.spec.template.spec.containers[0].env[]; .name == "PROOFS_KEYRING_FILE" and .value == "/etc/vaultsmith/attestation/keyring.json") and
            any(.spec.template.spec.volumes[]; .name == "attestation-keyring" and .secret.secretName == "vaultsmith-attestation" and .secret.optional == false) and
            any(.spec.template.spec.containers[0].volumeMounts[]; .name == "attestation-keyring" and .mountPath == "/etc/vaultsmith/attestation" and .readOnly == true)
          ' <<< "$proof_deployment" >/dev/null

          probe_name=vaultsmith-attestation-probe
          kubectl run "$probe_name" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --command -- sleep 300
          kubectl wait \
            --namespace "$NAMESPACE" \
            --for=condition=Ready \
            pod/"$probe_name" \
            --timeout=120s
          trap 'kubectl delete pod "$probe_name" --namespace "$NAMESPACE" --ignore-not-found --wait=false' EXIT

          printf '%s' '{"version":1,"active":"synthetic-key-b","keys":[{"id":"synthetic-key","state":"retired","publicKey":"iojj3XQJ8ZX9UtstPLpdcspnCb8dlBIb83SIAbQPb1w"},{"id":"synthetic-key-b","state":"active","publicKey":"gTl3Dqh9F19Wo1Rmw0x-zMuNipG07jeiXfYPW4_Js5Q","privateKey":"AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI"}]}' > "$RUNNER_TEMP/vaultsmith-keyring-b.json"
          printf '%s' '{"version":1,"active":"synthetic-key-b","keys":' > "$RUNNER_TEMP/vaultsmith-keyring-malformed.json"
          printf '%s' '{"version":1,"active":"synthetic-key-b","keys":[{"id":"synthetic-key","state":"revoked","publicKey":"iojj3XQJ8ZX9UtstPLpdcspnCb8dlBIb83SIAbQPb1w"},{"id":"synthetic-key-b","state":"active","publicKey":"gTl3Dqh9F19Wo1Rmw0x-zMuNipG07jeiXfYPW4_Js5Q","privateKey":"AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI"}]}' > "$RUNNER_TEMP/vaultsmith-keyring-b-revoked.json"

          wait_for_metric() {
            metric="$1"
            description="$2"
            for _ in $(seq 1 90); do
              metrics="$(kubectl exec "$probe_name" --namespace "$NAMESPACE" -- curl --fail --silent --show-error http://vaultsmith:8080/metrics || true)"
              if grep -Fq "$metric" <<< "$metrics"; then
                return 0
              fi
              sleep 2
            done
            echo "$description" >&2
            exit 1
          }

          request_from_probe() {
            local body="$1"
            local path="$2"
            kubectl exec -i "$probe_name" --namespace "$NAMESPACE" -- curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "http://vaultsmith:8080${path}" <<< "$body"
          }

          input_response="$(request_from_probe '{"plaintext":"synthetic-kind-input"}' '/api/v1/profiles/dev/encrypt')"
          input_vault="$(jq -r '.vaultText' <<< "$input_response")"
          test -n "$input_vault"
          rotation_request="$(jq -cn \
            --arg vault "$input_vault" \
            '{sourceProfileId:"dev",destinationProfileId:"prod",vaultText:$vault,attestation:{binding:{repository:"synthetic/project",revision:"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",path:"synthetic/path",selector:"synthetic"}}}')"
          rotation_a="$(request_from_probe "$rotation_request" '/api/v1/rotations')"
          output_a="$(jq -r '.vaultText' <<< "$rotation_a")"
          proof_a="$(jq -c '.attestation' <<< "$rotation_a")"
          test -n "$output_a"
          test "$proof_a" != null
          verify_request="$(jq -cn \
            --argjson attestation "$proof_a" \
            --arg input "$input_vault" \
            --arg output "$output_a" \
            '{attestation:$attestation,inputVaultText:$input,outputVaultText:$output,expectedBinding:{repository:"synthetic/project",revision:"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",path:"synthetic/path",selector:"synthetic"}}')"
          verify_a="$(request_from_probe "$verify_request" '/api/v1/attestations/verify')"
          jq -e '.valid == true and .attestation.kid == "synthetic-key"' <<< "$verify_a" >/dev/null

          kubectl create secret generic vaultsmith-attestation \
            --namespace "$NAMESPACE" \
            --from-file=keyring.json="$RUNNER_TEMP/vaultsmith-keyring-b.json" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          wait_for_metric 'vaultsmith_attestation_keyring_reload_total{outcome="success"} 1' 'valid projected Secret replacement did not reload'
          wait_for_metric 'vaultsmith_attestation_keyring_loaded 1' 'keyring was not loaded after valid replacement'
          rotation_b="$(request_from_probe "$rotation_request" '/api/v1/rotations')"
          output_b="$(jq -r '.vaultText' <<< "$rotation_b")"
          proof_b="$(jq -c '.attestation' <<< "$rotation_b")"
          test -n "$output_b"
          test "$proof_b" != null
          verify_b_request="$(jq -cn \
            --argjson attestation "$proof_b" \
            --arg input "$input_vault" \
            --arg output "$output_b" \
            '{attestation:$attestation,inputVaultText:$input,outputVaultText:$output,expectedBinding:{repository:"synthetic/project",revision:"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",path:"synthetic/path",selector:"synthetic"}}')"
          verify_b="$(request_from_probe "$verify_b_request" '/api/v1/attestations/verify')"
          jq -e '.valid == true and .attestation.kid == "synthetic-key-b"' <<< "$verify_b" >/dev/null
          verify_a_after_rotation="$(request_from_probe "$verify_request" '/api/v1/attestations/verify')"
          jq -e '.valid == true and .attestation.kid == "synthetic-key"' <<< "$verify_a_after_rotation" >/dev/null

          kubectl create secret generic vaultsmith-attestation \
            --namespace "$NAMESPACE" \
            --from-file=keyring.json="$RUNNER_TEMP/vaultsmith-keyring-malformed.json" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          wait_for_metric 'vaultsmith_attestation_keyring_reload_total{outcome="failed"} 1' 'malformed projected Secret replacement was not rejected'
          wait_for_metric 'vaultsmith_attestation_keyring_reload_total{outcome="success"} 1' 'previous valid keyring was not retained after malformed replacement'
          wait_for_metric 'vaultsmith_attestation_keyring_loaded 1' 'keyring readiness was lost after malformed replacement'
          verify_b_after_malformed="$(request_from_probe "$verify_b_request" '/api/v1/attestations/verify')"
          jq -e '.valid == true and .attestation.kid == "synthetic-key-b"' <<< "$verify_b_after_malformed" >/dev/null

          kubectl create secret generic vaultsmith-attestation \
            --namespace "$NAMESPACE" \
            --from-file=keyring.json="$RUNNER_TEMP/vaultsmith-keyring-b-revoked.json" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          wait_for_metric 'vaultsmith_attestation_keyring_reload_total{outcome="success"} 2' 'valid keyring was not restored after malformed replacement'
          verify_a_after_revoke="$(request_from_probe "$verify_request" '/api/v1/attestations/verify')"
          jq -e '.valid == false and .reason == "key_revoked"' <<< "$verify_a_after_revoke" >/dev/null
          verify_b_after_revoke="$(request_from_probe "$verify_b_request" '/api/v1/attestations/verify')"
          jq -e '.valid == true and .attestation.kid == "synthetic-key-b"' <<< "$verify_b_after_revoke" >/dev/null

          helm test "$RELEASE_NAME" \
            --namespace "$NAMESPACE" \
            --logs \
            --timeout 120s
          default_policies="$(kubectl get networkpolicy --namespace "$NAMESPACE" -o json | jq '.items | length')"
          test "$default_policies" -eq 0
      - name: Verify MCP rollout activation fence
        env:
          RELEASE_NAME: vaultsmith
          NAMESPACE: vaultsmith
        run: |
          set -euo pipefail
          # Enabling MCP changes the pod template and must complete the rolling
          # replacement before callers are allowed to activate the protocol.
          old_revision="$(kubectl get deployment "$RELEASE_NAME" --namespace "$NAMESPACE" -o jsonpath='{.metadata.generation}')"
          helm upgrade "$RELEASE_NAME" deploy/helm/vaultsmith \
            --namespace "$NAMESPACE" \
            --reuse-values \
            --set replicaCount=2 \
            --set mcp.enabled=true \
            --wait \
            --timeout 180s
          kubectl rollout status deployment/"$RELEASE_NAME" --namespace "$NAMESPACE" --timeout=120s
          deployment_json="$(kubectl get deployment "$RELEASE_NAME" --namespace "$NAMESPACE" -o json)"
          new_revision="$(jq -r '.metadata.generation' <<< "$deployment_json")"
          if ! test "$new_revision" -gt "$old_revision"; then
            echo "MCP rollout generation did not advance: before=$old_revision after=$new_revision" >&2
            exit 1
          fi
          if ! jq -e '
            .status.observedGeneration == .metadata.generation and
            .status.updatedReplicas == .spec.replicas and
            .status.readyReplicas == .spec.replicas and
            .status.availableReplicas == .spec.replicas and
            ((.status.unavailableReplicas // 0) == 0)
          ' <<< "$deployment_json" >/dev/null; then
            echo "MCP rollout did not converge to the desired Deployment state" >&2
            jq '{generation: .metadata.generation, observed: .status.observedGeneration, desired: .spec.replicas, updated: .status.updatedReplicas, ready: .status.readyReplicas, available: .status.availableReplicas, unavailable: (.status.unavailableReplicas // 0)}' <<< "$deployment_json" >&2
            exit 1
          fi
          pod_json="$(kubectl get pods --namespace "$NAMESPACE" -l app.kubernetes.io/name=vaultsmith,app.kubernetes.io/instance="$RELEASE_NAME" -o json)"
          pod_ips="$(jq -r '
            .items[] |
            select(.metadata.deletionTimestamp == null) |
            select(.status.phase == "Running") |
            select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
            .status.podIP
          ' <<< "$pod_json")"
          pod_count="$(printf '%s\n' "$pod_ips" | sed '/^$/d' | wc -l | tr -d ' ')"
          if ! test "$pod_count" -eq 2; then
            echo "MCP rollout active Ready pod count mismatch: configured=2 observed=$pod_count" >&2
            jq '[.items[] | {name: .metadata.name, deleting: (.metadata.deletionTimestamp != null), phase: .status.phase, ready: any(.status.conditions[]?; .type == "Ready" and .status == "True"), podIP: .status.podIP}]' <<< "$pod_json" >&2
            exit 1
          fi
          kubectl run mcp-probe \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --command -- sleep 300
          trap 'kubectl delete pod mcp-probe --namespace "$NAMESPACE" --ignore-not-found --wait=false >/dev/null' EXIT
          kubectl wait pod/mcp-probe --namespace "$NAMESPACE" --for=condition=Ready --timeout=60s
          index=0
          while IFS= read -r pod_ip; do
            test -n "$pod_ip"
            # The application image is distroless. Probe each pod IP from a
            # disposable client instead of assuming shell tools exist inside it.
            kubectl exec mcp-probe --namespace "$NAMESPACE" -- curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --header 'MCP-Protocol-Version: 2026-07-28' \
              --header 'Mcp-Method: server/discover' \
              --data-binary '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
              "http://${pod_ip}:8080/mcp" \
              | jq -e '.result.supportedVersions == ["2026-07-28"] and .result.resultType == "complete"' >/dev/null
            index=$((index + 1))
          done <<< "$pod_ips"
          kubectl delete pod mcp-probe --namespace "$NAMESPACE" --wait=true
          trap - EXIT
      - name: Exercise deny-all NetworkPolicy toggle
        env:
          RELEASE_NAME: vaultsmith
          NAMESPACE: vaultsmith
        run: |
          set -euo pipefail
          valkey_password_digest_before="$(kubectl get secret vaultsmith-valkey-auth --namespace "$NAMESPACE" -o jsonpath='{.data.default}' | sha256sum | cut -d' ' -f1)"
          valkey_strategy_before="$(kubectl get deployment vaultsmith-valkey --namespace "$NAMESPACE" -o jsonpath='{.spec.strategy.type}')"
          test "$valkey_strategy_before" = Recreate
          helm upgrade "$RELEASE_NAME" deploy/helm/vaultsmith \
            --namespace "$NAMESPACE" \
            --reuse-values \
            --set networkPolicy.enabled=true \
            --set networkPolicy.denyAllIngress=true \
            --wait \
            --timeout 180s
          valkey_password_digest_after="$(kubectl get secret vaultsmith-valkey-auth --namespace "$NAMESPACE" -o jsonpath='{.data.default}' | sha256sum | cut -d' ' -f1)"
          valkey_strategy_after="$(kubectl get deployment vaultsmith-valkey --namespace "$NAMESPACE" -o jsonpath='{.spec.strategy.type}')"
          test "$valkey_password_digest_before" = "$valkey_password_digest_after"
          test "$valkey_strategy_after" = Recreate
          deny_all_policy="$(kubectl get networkpolicy --namespace "$NAMESPACE" -o json)"
          test "$(jq '.items | length' <<<"$deny_all_policy")" -eq 1
          test "$(jq -c '.items[0].spec.ingress // []' <<<"$deny_all_policy")" = '[]'
          helm upgrade "$RELEASE_NAME" deploy/helm/vaultsmith \
            --namespace "$NAMESPACE" \
            --reset-values \
            --values deploy/helm/vaultsmith/tests/values-kind.yaml \
            --wait \
            --timeout 180s
          restored_policies="$(kubectl get networkpolicy --namespace "$NAMESPACE" -o json | jq '.items | length')"
          test "$restored_policies" -eq 0

  smoke:
    name: Smoke round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build embedded frontend
        working-directory: frontend
        run: npm run build
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run smoke test
        run: make smoke

  attestation-smoke:
    name: Attestation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run attestation qualification smoke test
        run: make smoke-attestation

  attestation-fuzz:
    name: Attestation fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run bounded attestation fuzz targets
        run: |
          set -euo pipefail
          go test ./backend/internal/attestation -run=^$ -fuzz=FuzzParseJWS -fuzztime=2s
          go test ./backend/internal/attestation -run=^$ -fuzz=FuzzStrictClaims -fuzztime=2s
          go test ./backend/internal/attestation -run=^$ -fuzz=FuzzCanonicalEnvelope -fuzztime=2s
          go test ./backend/internal/attestationkeyring -run=^$ -fuzz=FuzzParseNeverPanics -fuzztime=2s

  native-integration:
    name: Native authentication integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native OIDC integration
        run: ./scripts/integration-native.sh

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build container
        run: docker build --tag vaultsmith:ci .

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Syft
        id: syft_primary
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.50.0
      - name: Retry Syft installation
        if: steps.syft_primary.outcome == 'failure'
        id: syft_retry
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.50.0
      - name: Add Syft to PATH
        env:
          PRIMARY_SYFT: ${{ steps.syft_primary.outputs.cmd }}
          RETRY_SYFT: ${{ steps.syft_retry.outputs.cmd }}
        run: |
          set -euo pipefail
          syft_cmd="${RETRY_SYFT:-${PRIMARY_SYFT:-}}"
          test -x "$syft_cmd"
          echo "$(dirname "$syft_cmd")" >> "$GITHUB_PATH"
      - name: Install GoReleaser
        id: goreleaser_primary
        continue-on-error: true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.2
          install-only: true
      - name: Retry GoReleaser installation
        if: steps.goreleaser_primary.outcome == 'failure'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.2
          install-only: true
      - name: Build a non-publishing snapshot
        run: goreleaser release --snapshot --clean
      - name: Verify static API reference in every release archive
        run: |
          set -euo pipefail
          archive_count=0
          for archive in dist/*.tar.gz; do
            test -f "$archive"
            tar -tzf "$archive" 'docs/api-reference.md' >/dev/null
            archive_count=$((archive_count + 1))
          done
          for archive in dist/*.zip; do
            test -f "$archive"
            unzip -Z1 "$archive" 'docs/api-reference.md' >/dev/null
            archive_count=$((archive_count + 1))
          done
          test "$archive_count" -eq 6

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
