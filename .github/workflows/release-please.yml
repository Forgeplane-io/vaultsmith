name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Dispatch artifact publication
        if: steps.release.outputs.tag_name != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            if (!tag) {
              core.setFailed('Release Please reported a release without a tag_name');
              return;
            }
            const { owner, repo } = context.repo;
            let draft;
            for (let attempt = 1; attempt <= 12 && !draft; attempt += 1) {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });
              draft = releases.find((release) => release.tag_name === tag && release.draft);
              if (!draft && attempt < 12) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }
            if (!draft) {
              core.setFailed(`Release Please draft not found for ${tag}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'release.yml',
              ref: tag,
              inputs: { tag, release_id: String(draft.id) },
            });
            core.info(`Dispatched release.yml for ${tag} using draft release ${draft.id}`);
