name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to publish or recover a draft release
        required: true
        type: string
      release_id:
        description: GitHub draft release ID for an explicit recovery
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/forgeplane-io/vaultsmith
  CHART_REPOSITORY: oci://ghcr.io/forgeplane-io/charts

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      build_date: ${{ steps.release.outputs.build_date }}
      release_draft: ${{ steps.release.outputs.release_draft }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate tag and source commit
        id: release
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${tag}^{commit}")"
          if [[ "$checked_out_sha" != "$tag_sha" ]]; then
            echo "tag $tag resolves to $tag_sha, but checkout is $checked_out_sha" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$checked_out_sha"
            echo "build_date=$(git show -s --format=%cI "$checked_out_sha")"
          } >> "$GITHUB_OUTPUT"

          release_id="${INPUT_RELEASE_ID:-}"
          if [[ -n "$release_id" && ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "invalid release ID: $release_id" >&2
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if [[ -n "$release_id" ]]; then
              if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" 2>/dev/null)"; then
                if jq -e --arg tag "$tag" '.tag_name == $tag' <<<"$release_json" >/dev/null; then
                  echo "release_draft=$(jq -r '.draft | tostring' <<<"$release_json")" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            elif release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null)"; then
              if jq -e --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft == true)' <<<"$release_json" >/dev/null; then
                echo 'release_draft=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "waiting for Release Please draft for $tag (attempt $attempt/12)"
            sleep 5
          done
          echo "Release not found for $tag${release_id:+ (release ID $release_id)}" >&2
          exit 1

  acceptance:
    name: Verify exact-source CI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Verify validated source checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            printf 'release source: checkout %s does not match validated SHA %s; aborting.\n' "$checked_out_sha" "$SOURCE_SHA" >&2
            exit 1
          fi
      - name: Require successful full CI for exact source
        run: bash scripts/verify_release_ci.sh

  publish:
    name: Build and publish release
    needs: [validate, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      BUILD_DATE: ${{ needs.validate.outputs.build_date }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Verify validated source checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            printf 'release source: checkout %s does not match validated SHA %s; aborting.\n' "$checked_out_sha" "$SOURCE_SHA" >&2
            exit 1
          fi

      - name: Set up Go
        if: needs.validate.outputs.release_draft == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        if: needs.validate.outputs.release_draft == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Syft
        if: needs.validate.outputs.release_draft == 'true'
        id: syft_primary
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.50.0

      - name: Retry Syft installation
        if: needs.validate.outputs.release_draft == 'true' && steps.syft_primary.outcome == 'failure'
        id: syft_retry
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.50.0

      - name: Add Syft to PATH
        if: needs.validate.outputs.release_draft == 'true'
        env:
          PRIMARY_SYFT: ${{ steps.syft_primary.outputs.cmd }}
          RETRY_SYFT: ${{ steps.syft_retry.outputs.cmd }}
        run: |
          set -euo pipefail
          syft_cmd="${RETRY_SYFT:-${PRIMARY_SYFT:-}}"
          test -x "$syft_cmd"
          echo "$(dirname "$syft_cmd")" >> "$GITHUB_PATH"

      - name: Install GoReleaser
        if: needs.validate.outputs.release_draft == 'true'
        id: goreleaser_primary
        continue-on-error: true
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.2
          install-only: true

      - name: Retry GoReleaser installation
        if: needs.validate.outputs.release_draft == 'true' && steps.goreleaser_primary.outcome == 'failure'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.14.2
          install-only: true

      - name: Verify checksum producer availability
        env:
          RELEASE_DRAFT: ${{ needs.validate.outputs.release_draft }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_DRAFT" != 'true' ]]; then
            printf 'release checksum provenance: non-draft recovery has no trusted original checksum evidence; aborting before publication. Do not use existing release assets as producer evidence.\n' >&2
            exit 1
          fi

      - name: Verify remote tag before publication
        run: |
          set -euo pipefail
          if remote_refs="$(git ls-remote --exit-code origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" 2>/dev/null)"; then
            remote_tag_sha="$(awk -v tag="refs/tags/${TAG}" '
              $2 == tag { direct = $1 }
              $2 == tag "^{}" { peeled = $1 }
              END { print (peeled != "" ? peeled : direct) }
            ' <<<"$remote_refs")"
          else
            rc=$?
            printf 'release publication: cannot resolve remote tag %s (git exit %s); verify tag availability before retrying.\n' "$TAG" "$rc" >&2
            exit 1
          fi
          if [[ "$remote_tag_sha" != "$SOURCE_SHA" ]]; then
            printf 'release publication: remote tag %s resolves to %s, expected %s; resolve the discrepancy before retrying.\n' "$TAG" "$remote_tag_sha" "$SOURCE_SHA" >&2
            exit 1
          fi

      - name: Run GoReleaser
        if: needs.validate.outputs.release_draft == 'true'
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record release checksum digest
        id: checksums
        run: |
          set -euo pipefail
          if [[ ! -f dist/checksums.txt ]]; then
            printf 'release checksum provenance: missing GoReleaser output dist/checksums.txt; aborting before signing.\n' >&2
            exit 1
          fi
          checksum_sha256="$(sha256sum dist/checksums.txt | cut -d' ' -f1)"
          printf 'sha256=%s\n' "$checksum_sha256" >> "$GITHUB_OUTPUT"
          printf 'Release checksums SHA-256: `%s`\n\n' "$checksum_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}

      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true

      - name: Attest container provenance
        if: ${{ github.repository_visibility == 'public' && github.sha == needs.validate.outputs.sha }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - name: Package and push Helm chart
        id: chart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST:-}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'release chart packaging: IMAGE_DIGEST must be sha256:<64 lowercase hex characters>; aborting before chart publication.\n' >&2
            exit 1
          fi
          chart_dir="$(mktemp -d)"
          trap 'rm -rf "$chart_dir"' EXIT
          cp -R deploy/helm/vaultsmith "$chart_dir/vaultsmith"
          printf '\nannotations:\n  vaultsmith.io/image-digest: "%s"\n' "$IMAGE_DIGEST" >> "$chart_dir/vaultsmith/Chart.yaml"
          mkdir -p dist/chart
          helm package "$chart_dir/vaultsmith" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/chart
          helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin <<< "$GH_TOKEN"
          chart_archive="dist/chart/vaultsmith-${VERSION}.tgz"
          if ! push_output="$(helm push "$chart_archive" "$CHART_REPOSITORY" 2>&1)"; then
            printf 'release chart publication: Helm push failed; aborting before signing.\n' >&2
            exit 1
          fi
          chart_digest="$(sed -n 's/^Digest: //p' <<<"$push_output")"
          if [[ ! "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'release chart publication: push must return one manifest digest sha256:<64 lowercase hex characters>; aborting before signing.\n' >&2
            exit 1
          fi
          chart_reference="${CHART_REPOSITORY#oci://}/vaultsmith@${chart_digest}"
          mkdir -p "$chart_dir/readback"
          if ! readback_output="$(helm pull "oci://${chart_reference}" --destination "$chart_dir/readback" 2>&1)"; then
            printf 'release chart readback: cannot pull the producing manifest digest; aborting before signing.\n' >&2
            exit 1
          fi
          readback_digest="$(sed -n 's/^Digest: //p' <<<"$readback_output")"
          if [[ "$readback_digest" != "$chart_digest" ]]; then
            printf 'release chart readback: manifest digest does not match the producing push; aborting before signing.\n' >&2
            exit 1
          fi
          if ! cmp -s "$chart_archive" "$chart_dir/readback/"*.tgz; then
            printf 'release chart readback: archive does not match the local release package; aborting before signing.\n' >&2
            exit 1
          fi
          printf 'reference=%s\n' "$chart_reference" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image and Helm chart
        env:
          COSIGN_YES: 'true'
          CHART_REFERENCE: ${{ steps.chart.outputs.reference }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${{ steps.image.outputs.digest }}"
          cosign sign --yes "$CHART_REFERENCE"

      - name: Sign release checksums
        env:
          CHECKSUM_SHA256: ${{ steps.checksums.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "${CHECKSUM_SHA256:-}" =~ ^[a-f0-9]{64}$ ]]; then
            printf 'release checksum provenance: missing or malformed producing SHA-256; aborting before signing.\n' >&2
            exit 1
          fi
          mkdir -p dist/release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --dir dist/release
          for checksum_file in dist/checksums.txt dist/release/checksums.txt; do
            observed_sha256="$(sha256sum "$checksum_file" | cut -d' ' -f1)"
            if [[ "$observed_sha256" != "$CHECKSUM_SHA256" ]]; then
              printf 'release checksum verification: %s does not match the producing SHA-256; aborting before signing.\n' "$checksum_file" >&2
              exit 1
            fi
          done
          cosign sign-blob --yes \
            --bundle dist/release/checksums.txt.bundle \
            dist/checksums.txt
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/release/checksums.txt.bundle

      - name: Verify release outputs
        env:
          CHART_REFERENCE: ${{ steps.chart.outputs.reference }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
          printf 'image=%s@%s\n' "$IMAGE" '${{ steps.image.outputs.digest }}'
          printf 'chart=%s\n' "$CHART_REFERENCE"
          printf '%s\n' \
            '### Vaultsmith release' \
            "- Tag: $TAG" \
            "- Source: $SOURCE_SHA" \
            "- Image digest: ${IMAGE}@${{ steps.image.outputs.digest }}" \
            "- Helm chart: oci://${CHART_REFERENCE}" \
            >> "$GITHUB_STEP_SUMMARY"
