name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/forgeplane-io/vaultsmith
  CHART_REPOSITORY: oci://ghcr.io/forgeplane-io/charts

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate tag and source commit
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${tag}^{commit}")"
          if [[ "$checked_out_sha" != "$tag_sha" ]]; then
            echo "tag $tag resolves to $tag_sha, but checkout is $checked_out_sha" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$checked_out_sha"
            echo "build_date=$(git show -s --format=%cI "$checked_out_sha")"
          } >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 12); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft >/tmp/release.json 2>/dev/null; then
              if jq -e --arg tag "$tag" '.tagName == $tag and .isDraft == true' /tmp/release.json >/dev/null; then
                exit 0
              fi
            fi
            echo "waiting for Release Please draft for $tag (attempt $attempt/12)"
            sleep 5
          done
          echo "Release Please draft not found for $tag" >&2
          exit 1

  publish:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      BUILD_DATE: ${{ needs.validate.outputs.build_date }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.50.0

      - name: Add Syft to PATH
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.14.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}

      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true

      - name: Attest container provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.17.3

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist/chart
          helm package deploy/helm/vaultsmith \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/chart
          helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin <<< "$GH_TOKEN"
          helm push "dist/chart/vaultsmith-${VERSION}.tgz" "$CHART_REPOSITORY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image and Helm chart
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${{ steps.image.outputs.digest }}"
          cosign sign --yes "ghcr.io/forgeplane-io/charts/vaultsmith:${VERSION}"

      - name: Sign release checksums
        run: |
          set -euo pipefail
          mkdir -p dist/release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --dir dist/release
          cosign sign-blob --yes \
            --bundle dist/release/checksums.txt.bundle \
            dist/release/checksums.txt
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/release/checksums.txt.bundle

      - name: Verify release outputs
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
          printf 'image=%s@%s\n' "$IMAGE" '${{ steps.image.outputs.digest }}'
          printf 'chart=%s:%s\n' "$CHART_REPOSITORY/vaultsmith" "$VERSION"
          {
            echo "### Vaultsmith release"
            echo "- Tag: \\`$TAG\\`"
            echo "- Source: \\`$SOURCE_SHA\\`"
            echo "- Image digest: \\`${IMAGE}@${{ steps.image.outputs.digest }}\\`"
            echo "- Helm chart: \\`${CHART_REPOSITORY}/vaultsmith:${VERSION}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
