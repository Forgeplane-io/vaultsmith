version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: helm
    directory: /deploy/helm/vaultsmith
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    allow:
      - dependency-type: all
    # Dependabot mistakes parent scs tags for redisstore releases.
    # Update this untagged submodule manually until fixed upstream.
    ignore:
      - dependency-name: github.com/alexedwards/scs/redisstore
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    allow:
      - dependency-type: all
    # v2.8.1 lacks oapi-codegen#2608, required by Speakeasy OpenAPI 1.26.
    # Keep the commit pin until a stable release contains the fix.
    ignore:
      - dependency-name: github.com/oapi-codegen/oapi-codegen/v2
        versions:
          - "2.8.1"
    open-pull-requests-limit: 5
    groups:
      api-go-tools:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      frontend-production:
        dependency-type: production
        patterns:
          - "react"
          - "react-dom"
      frontend-development:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /api/typescript-generator
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # openapi-typescript currently requires TypeScript ^5.x.
    # Remove when a published generator supports newer TypeScript majors.
    ignore:
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
    groups:
      api-typescript-tools:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns:
          - "*"
