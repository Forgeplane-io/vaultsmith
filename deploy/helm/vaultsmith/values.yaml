replicaCount: 1

image:
  repository: ghcr.io/forgeplane-io/vaultsmith
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

containerPort: 8080

# Authentication is deliberately explicit. `off` is for local/development use only;
# production deployments should set this to `native` and provide every required ref.
auth:
  # Required: set explicitly to "native" or "off". Quote "off" in YAML;
  # unquoted `off` may be parsed as Boolean false and is rejected.
  mode: ""
  csrf:
    existingSecret: ""
    key: csrf-secret
  oidc:
    issuerURL: ""
    clientID: ""
    clientSecret:
      existingSecret: ""
      key: oidc-client-secret
    redirectURL: ""
    publicBaseURL: ""
    ca:
      existingConfigMap: ""
      key: ca.crt
    groupsClaim: groups
    scopes:
      - openid
      - profile
      - offline_access
  session:
    absoluteLifetime: 8h
    idleLifetime: 30m
    secure: true
    sameSite: lax
  redis:
    address: ""
    username: ""
    password:
      existingSecret: ""
      key: redis-password
    database: 0
    tls: false
    connectTimeout: 5s
    readTimeout: 5s
    writeTimeout: 5s
    poolSize: 10
    refreshLockTTL: 15s
    refreshLockWait: 250ms
    refreshLockRetry: 25ms
    providerTimeout: 10s
    keyPrefix: "vaultsmith:"
  policy:
    existingConfigMap: ""
    key: policy.csv
    data: ""
  cors:
    allowedOrigins: []

mcp:
  enabled: false

# Proofs are disabled by default. When enabled, existingSecret must contain
# the application-owned versioned keyring under the fixed key `keyring.json`.
proofs:
  enabled: false
  existingSecret: ""

# The official Valkey chart is included by default. Set enabled to false only
# when auth.redis.address points to an externally managed Valkey/Redis service.
valkey:
  enabled: true
  service:
    type: ClusterIP
    # The official chart currently configures the Valkey server on TCP 6379.
    port: 6379
  deploymentStrategy: Recreate
  serviceAccount:
    automount: false
  dataStorage:
    enabled: true
    requestedSize: 1Gi
  auth:
    enabled: true
    # The parent chart creates this Secret and preserves its password on upgrade.
    usersExistingSecret: '{{ include "valkey.fullname" . }}-auth'
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: default

profiles: []

secret:
  existingSecret: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vault.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  denyAllIngress: false
  allowedIngress: []
  # Each item may contain Kubernetes `to` and `ports` fields. Native mode must
  # explicitly allow egress to the OIDC issuer and Redis, unless policy is disabled.
  allowedEgress: []

resources: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
