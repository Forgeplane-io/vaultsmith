replicaCount: 1

image:
  repository: ghcr.io/forgeplane-io/vaultsmith
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

containerPort: 8080

profiles: []

secret:
  existingSecret: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vault.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  denyAllIngress: false
  allowedIngress: []

resources: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
