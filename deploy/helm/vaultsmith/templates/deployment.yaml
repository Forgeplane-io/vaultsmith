{{- include "vaultsmith.validate" . -}}
{{- $fullName := include "vaultsmith.fullname" . -}}
{{- $configChecksum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "vaultsmith.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vaultsmith.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vaultsmith.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/profiles: {{ $configChecksum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vaultsmith.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.auth.policy.existingConfigMap .Values.auth.policy.data .Values.auth.oidc.ca.existingConfigMap }}
      volumes:
        {{- if or .Values.auth.policy.existingConfigMap .Values.auth.policy.data }}
        - name: policy
          configMap:
            name: {{ default (include "vaultsmith.fullname" .) .Values.auth.policy.existingConfigMap }}
            items:
              - key: {{ .Values.auth.policy.key | quote }}
                path: policy.csv
        {{- end }}
        {{- if .Values.auth.oidc.ca.existingConfigMap }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.auth.oidc.ca.existingConfigMap | quote }}
            items:
              - key: {{ .Values.auth.oidc.ca.key | quote }}
                path: ca.crt
        {{- end }}
      {{- end }}
      containers:
        - name: vaultsmith
          image: {{ include "vaultsmith.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: HTTP_ADDR
              value: "{{ printf ":%d" (int .Values.containerPort) }}"
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.auth.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientID | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.auth.oidc.redirectURL | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.auth.oidc.publicBaseURL | quote }}
            {{- if .Values.auth.oidc.ca.existingConfigMap }}
            - name: OIDC_CA_FILE
              value: /etc/vaultsmith/oidc-ca/ca.crt
            {{- end }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            - name: OIDC_SCOPES
              value: {{ join " " .Values.auth.oidc.scopes | quote }}
            - name: AUTHZ_POLICY_FILE
              value: "/etc/vaultsmith/policy/policy.csv"
            - name: SESSION_ABSOLUTE_LIFETIME
              value: {{ .Values.auth.session.absoluteLifetime | quote }}
            - name: SESSION_IDLE_LIFETIME
              value: {{ .Values.auth.session.idleLifetime | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.auth.session.secure | quote }}
            - name: COOKIE_SAME_SITE
              value: {{ .Values.auth.session.sameSite | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.auth.redis.address | quote }}
            - name: REDIS_USERNAME
              value: {{ .Values.auth.redis.username | quote }}
            - name: REDIS_DB
              value: {{ .Values.auth.redis.database | quote }}
            - name: REDIS_TLS
              value: {{ .Values.auth.redis.tls | quote }}
            - name: REDIS_CONNECT_TIMEOUT
              value: {{ .Values.auth.redis.connectTimeout | quote }}
            - name: REDIS_READ_TIMEOUT
              value: {{ .Values.auth.redis.readTimeout | quote }}
            - name: REDIS_WRITE_TIMEOUT
              value: {{ .Values.auth.redis.writeTimeout | quote }}
            - name: REDIS_POOL_SIZE
              value: {{ .Values.auth.redis.poolSize | quote }}
            - name: REDIS_REFRESH_LOCK_TTL
              value: {{ .Values.auth.redis.refreshLockTTL | quote }}
            - name: REDIS_REFRESH_LOCK_WAIT
              value: {{ .Values.auth.redis.refreshLockWait | quote }}
            - name: REDIS_REFRESH_LOCK_RETRY
              value: {{ .Values.auth.redis.refreshLockRetry | quote }}
            - name: REDIS_PROVIDER_TIMEOUT
              value: {{ .Values.auth.redis.providerTimeout | quote }}
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.auth.redis.keyPrefix | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.auth.cors.allowedOrigins | quote }}
            {{- if .Values.auth.csrf.existingSecret }}
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.csrf.existingSecret | quote }}
                  key: {{ .Values.auth.csrf.key | quote }}
                  optional: false
            {{- end }}
            {{- if .Values.auth.oidc.clientSecret.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.clientSecret.existingSecret | quote }}
                  key: {{ .Values.auth.oidc.clientSecret.key | quote }}
                  optional: false
            {{- end }}
            {{- if .Values.auth.redis.password.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.redis.password.existingSecret | quote }}
                  key: {{ .Values.auth.redis.password.key | quote }}
                  optional: false
            {{- end }}
            - name: VAULT_PROFILES_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullName }}
                  key: profiles.json
            {{- range .Values.profiles }}
            - name: {{ .passwordEnv | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.existingSecret | quote }}
                  key: {{ .passwordSecretKey | quote }}
                  optional: false
            {{- end }}
          volumeMounts:
            {{- if or .Values.auth.policy.existingConfigMap .Values.auth.policy.data }}
            - name: policy
              mountPath: /etc/vaultsmith/policy
              readOnly: true
            {{- end }}
            {{- if .Values.auth.oidc.ca.existingConfigMap }}
            - name: oidc-ca
              mountPath: /etc/vaultsmith/oidc-ca
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
