{{- include "vaultsmith.validate" . -}}
{{- $hasIngress := or .Values.networkPolicy.denyAllIngress .Values.networkPolicy.allowedIngress }}
{{- $hasEgress := .Values.networkPolicy.allowedEgress }}
{{- if and .Values.networkPolicy.enabled (or $hasIngress $hasEgress) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultsmith.fullname" . }}
  labels:
    {{- include "vaultsmith.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vaultsmith.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- if $hasIngress }}
    - Ingress
    {{- end }}
    {{- if $hasEgress }}
    - Egress
    {{- end }}
  {{- if .Values.networkPolicy.allowedIngress }}
  ingress:
    {{- range .Values.networkPolicy.allowedIngress }}
    {{- $from := dict }}
    {{- if .namespaceSelector }}{{ $_ := set $from "namespaceSelector" .namespaceSelector }}{{ end }}
    {{- if .podSelector }}{{ $_ := set $from "podSelector" .podSelector }}{{ end }}
    - from:
      {{ toYaml (list $from) | nindent 8 }}
    {{- end }}
  {{- else if .Values.networkPolicy.denyAllIngress }}
  ingress: []
  {{- end }}
  {{- if .Values.networkPolicy.allowedEgress }}
  egress:
    {{- range .Values.networkPolicy.allowedEgress }}
    - {{- with .to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
