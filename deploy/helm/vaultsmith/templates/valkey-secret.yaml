{{- if .Values.valkey.enabled }}
{{- $secretName := include "vaultsmith.valkeyAuthSecretName" . -}}
{{- $password := randAlphaNum 32 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $existing -}}
{{- if not (hasKey $existing.data "default") }}{{ fail (printf "Valkey Secret %q exists but has no default key" $secretName) }}{{ end -}}
{{- $password = index $existing.data "default" | b64dec -}}
{{- if eq $password "" }}{{ fail (printf "Valkey Secret %q has an empty default key" $secretName) }}{{ end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "vaultsmith.labels" . | nindent 4 }}
type: Opaque
stringData:
  default: {{ $password | quote }}
{{- end }}
