auth:
  mode: "off"

image:
  repository: vaultsmith
  tag: ci
  pullPolicy: IfNotPresent

profiles:
  - id: dev
    label: Development
    passwordEnv: VAULT_PASSWORD_DEV
    passwordSecretKey: dev
  - id: prod
    label: Production
    passwordEnv: VAULT_PASSWORD_PROD
    passwordSecretKey: prod

secret:
  existingSecret: vaultsmith-passwords

valkey:
  dataStorage:
    enabled: false
